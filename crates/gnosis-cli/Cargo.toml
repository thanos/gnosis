[package]
name = "gnosis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Gnosis — enterprise knowledge compiler CLI"
readme = "../../README.md"
keywords = ["knowledge", "compiler", "okf", "tree-sitter", "tui"]
categories = ["command-line-utilities", "development-tools"]
default-run = "gnosis"

[lib]
name = "gnosis"
path = "src/lib.rs"

[[bin]]
name = "gnosis"
path = "src/main.rs"

[dependencies]
gnosis-core.workspace = true
gnosis-providers.workspace = true
gnosis-okf.workspace = true
gnosis-tui.workspace = true
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
